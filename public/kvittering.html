<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b3491e" />
    <title>Bestillingen din</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topp">
      <div class="topp__rad">
        <h1>Bestillingen din</h1>
        <a class="knapp knapp--sekundaer knapp--liten" href="/">Ny bestilling</a>
      </div>
    </header>

    <main class="innhold">
      <div class="melding melding--feil" id="feilmelding" hidden role="alert"></div>

      <div id="laster" class="tom puls">Henter bestillingen …</div>

      <div id="kvittering" hidden>
        <section class="kort senter">
          <div style="color: var(--tekst-svak); font-size: 0.85rem">Hentenummer</div>
          <div class="stornummer" id="hentenummer">–</div>
          <div id="hentetid" style="color: var(--tekst-svak)"></div>
          <div class="mellomrom"><span id="statusmerke" class="merke merke--grau"></span></div>
        </section>

        <section class="kort" id="betalingskort">
          <h2 id="betaling-tittel">Betaling</h2>
          <div id="betaling-innhold" class="mellomrom"></div>
        </section>

        <section class="kort">
          <h2>Dette bestilte du</h2>
          <div class="mellomrom" id="linjer"></div>
          <div class="tabellsum tabellsum--total">
            <span>Til sammen</span>
            <span id="total">–</span>
          </div>
        </section>

        <p class="hjelpetekst senter mellomrom">
          Ta vare på denne siden til du har hentet maten.
        </p>
      </div>
    </main>

    <script src="/kvittering.js" type="module"></script>
  </body>
</html>
