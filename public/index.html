<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b3491e" />
    <title>Bestill i kantina</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topp">
      <div class="topp__rad">
        <div>
          <h1 id="kantine-navn">Kantina</h1>
          <div class="topp__undertekst" id="velkomsttekst"></div>
        </div>
      </div>
    </header>

    <main class="innhold">
      <div class="melding melding--feil" id="feilmelding" hidden role="alert"></div>
      <div class="melding melding--info" id="stengtmelding" hidden></div>

      <div id="laster" class="tom puls">Henter menyen …</div>

      <div id="meny"></div>

      <!-- Skjemaet vises først når noe er lagt i kurven. -->
      <section id="bestilling" class="kort mellomrom" hidden>
        <h2>Hvem er maten til?</h2>

        <div class="felt mellomrom">
          <label for="elev-navn">Navn</label>
          <input
            id="elev-navn"
            type="text"
            autocomplete="name"
            maxlength="60"
            placeholder="Fornavn og etternavn"
            required
          />
        </div>

        <div class="felt">
          <label for="klasse">Klasse</label>
          <input id="klasse" type="text" maxlength="20" placeholder="F.eks. 9B" />
        </div>

        <div class="felt" id="hentetid-felt" hidden>
          <label for="hentetid">Når vil du hente?</label>
          <select id="hentetid"></select>
          <div class="hjelpetekst" id="hentetid-beskjed" hidden></div>
        </div>

        <div class="felt">
          <label for="merknad">Melding til kjøkkenet</label>
          <input id="merknad" type="text" maxlength="200" placeholder="F.eks. uten majones" />
          <div class="hjelpetekst">Valgfritt. Har du allergier, si det også i luka.</div>
        </div>
      </section>
    </main>

    <div class="kurvlinje" id="kurvlinje" hidden>
      <div class="kurvlinje__inner">
        <div class="kurvlinje__sum">
          <span id="kurv-antall">0 varer</span>
          <strong id="kurv-sum">0,00 kr</strong>
        </div>
        <button class="knapp" id="bestill-knapp" type="button">Bestill</button>
      </div>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
